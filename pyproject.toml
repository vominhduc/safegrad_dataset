[project]
name = "safegrad"
version = "0.1.0"
description = "SafeGrad: Severity-Graded T2I Safety Benchmark"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.13.0",
    "diffusers>=0.35.1",
    "faiss-cpu>=1.13.2",
    "numpy>=2.4.4",
    "openai>=1.57.0",
    "pillow>=10.0.0",
    "sentence-transformers>=5.3.0",
    "spacy>=3.8.14",
    "torch>=2.0.0",
    "torchvision>=0.26.0",
    "transformers>=4.45.0",
    "tqdm>=4.67.3",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pandas>=2.2.0",
    "tiktoken>=0.12.0",
    "sentencepiece>=0.2.1",
    "protobuf>=7.34.1",
    "beautifulsoup4>=4.14.3",
    "pyarrow>=24.0.0",
]

[project.optional-dependencies]
toxicity = ["detoxify>=0.3.0"]

[project.scripts]
safegrad-stage1  = "safegrad.pipeline.stage1_clustering:main"
safegrad-stage2j = "safegrad.pipeline.stage2_interpolation:main"
safegrad-stage3  = "safegrad.pipeline.stage3_synthesis:main"
safegrad-stage4  = "safegrad.pipeline.stage4_verification:main"
safegrad-run     = "safegrad.scripts.run_pipeline:main"
safegrad-export  = "safegrad.scripts.export_metadata:main"
