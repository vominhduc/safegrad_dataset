version: "3"

vars:
  # ******************************************* #
  #      Get Team-Specific Exclusive Nodes      #
  # ******************************************* #
  # team_name: '{{ .team_name | default "Creative Vision Team" }}'
  # exclude_file: '{{ .exclude_file | default "/lustre/teams/mmai/mmai-job-setting/exclude_nodes.txt" }}'
  # exclude: "{{ .exclude }}"
  # nodelist: "{{ .nodelist }}"
  # EXCLUDE_NODES:
  #   sh: "sh setup/echo_exclude_nodes.sh -t {{ .team_name | quote }} -f {{ .exclude_file }}{{ if .exclude }} -e {{ .exclude }}{{ end }}"
  # RESERVED_NODES:
  #   sh: "uv run python -m setup.echo_nodelist -t {{ .team_name | quote }} -f {{ .exclude_file }}{{ if .nodelist }} -n {{ .nodelist }}{{ end }}"

tasks:
  pipeline:
    desc: Run the T2I-Escalate pipeline locally (use from_phase=N to resume from a specific phase)
    vars:
      input: '{{ .input | default "data/metadata.jsonl" }}'
      workdir: '{{ .workdir | default "data/pipeline_run" }}'
      rules: '{{ .rules | default "data/rules.jsonl" }}'
      hf_home: '{{ .hf_home | default "/lustre/users/${USER}/hf-cache" }}'
      from_phase: '{{ .from_phase | default "1" }}'
    cmds:
      - mkdir -p {{ .hf_home | quote }} && HF_HOME={{ .hf_home | quote }} TRANSFORMERS_CACHE={{ .hf_home | quote }} uv run python run_pipeline.py --input {{ .input | quote }} --workdir {{ .workdir | quote }} --rules {{ .rules | quote }} --start-from {{ .from_phase }} {{ .CLI_ARGS }}

  pipeline_gpu:
    desc: Submit the full pipeline as a GPU job (use from_phase=N to resume from a specific phase)
    vars:
      input: '{{ .input | default "data/metadata.jsonl" }}'
      workdir: '{{ .workdir | default "data/pipeline_run" }}'
      rules: '{{ .rules | default "data/rules.jsonl" }}'
      hf_home: '{{ .hf_home | default "/lustre/users/${USER}/hf-cache" }}'
      cpu: '{{ .cpu | default "128" }}'
      p: '{{ .p | default "002-partition-default" }}'
      tag: '{{ .tag | default "latest" }}'
      log_root: '{{ .log_root | default "./logs" }}'
      from_phase: '{{ .from_phase | default "1" }}'
    cmds:
      - |
        mkdir -p {{ .log_root }}
        WORKDIR=$(pwd)
        sbatch <<EOF
        #!/bin/bash
        #SBATCH --exclude=srdgx00095,srdgx00096,srdgx00113
        #SBATCH --job-name=t2i_pipeline
        #SBATCH --partition={{ .p }}
        #SBATCH --ntasks=1
        #SBATCH --cpus-per-task={{ .cpu }}
        #SBATCH --gres=gpu:1
        #SBATCH --output={{ .log_root }}/%x_%j.out
        #SBATCH --error={{ .log_root }}/%x_%j.err
        #SBATCH --container-image=/lustre/users/vmduc/container_cache/image_generation_pipeline:{{ .tag }}.sqsh
        #SBATCH --container-mounts=/lustre:/lustre,/store:/store,/home:/home

        cd "$WORKDIR" || { echo "Failure: Could not cd to $WORKDIR"; exit 1; }

        source .venv/bin/activate
        mkdir -p {{ .hf_home | quote }}
        export HF_HOME={{ .hf_home | quote }}
        export TRANSFORMERS_CACHE={{ .hf_home | quote }}

        PYTHONPATH=. uv run python run_pipeline.py --input {{ .input | quote }} --workdir {{ .workdir | quote }} --rules {{ .rules | quote }} --start-from {{ .from_phase }} {{ .CLI_ARGS }}
        EOF

  phase1:
    desc: Run Phase 1 locally
    vars:
      input: '{{ .input | default "data/metadata_sample.jsonl" }}'
      output: '{{ .output | default "data/pipeline_run/metadata_phase1.jsonl" }}'
      model: '{{ .model | default "all-MiniLM-L6-v2" }}'
      threshold: '{{ .threshold | default "0.95" }}'
      batch_size: '{{ .batch_size | default "512" }}'
      hf_home: '{{ .hf_home | default "/lustre/users/${USER}/hf-cache" }}'
    cmds:
      - mkdir -p {{ .hf_home | quote }} && HF_HOME={{ .hf_home | quote }} TRANSFORMERS_CACHE={{ .hf_home | quote }} uv run python -m pipeline.phase1_filter --input {{ .input | quote }} --output {{ .output | quote }} --model {{ .model | quote }} --threshold {{ .threshold | quote }} --batch-size {{ .batch_size | quote }} {{ .CLI_ARGS }}

  phase2:
    desc: Run Phase 2 locally
    vars:
      input: '{{ .input | default "data/pipeline_run/metadata_phase1.jsonl" }}'
      output: '{{ .output | default "data/pipeline_run/metadata_phase2.jsonl" }}'
      rules: '{{ .rules | default "data/rules.jsonl" }}'
      model: '{{ .model | default "Qwen/Qwen2.5-7B-Instruct" }}'
      backend: '{{ .backend | default "local" }}'
      embed_model: '{{ .embed_model | default "all-MiniLM-L6-v2" }}'
      base_url: '{{ .base_url | default "" }}'
      concurrency: '{{ .concurrency | default "8" }}'
      max_retries: '{{ .max_retries | default "3" }}'
      hf_home: '{{ .hf_home | default "/lustre/users/${USER}/hf-cache" }}'
    cmds:
      - mkdir -p {{ .hf_home | quote }} && HF_HOME={{ .hf_home | quote }} TRANSFORMERS_CACHE={{ .hf_home | quote }} uv run python -m pipeline.phase2_filter --input {{ .input | quote }} --output {{ .output | quote }} --rules {{ .rules | quote }} --model {{ .model | quote }} --backend {{ .backend | quote }} --embed-model {{ .embed_model | quote }} {{ if .base_url }}--base-url {{ .base_url | quote }} {{ end }}--concurrency {{ .concurrency | quote }} --max-retries {{ .max_retries | quote }} {{ .CLI_ARGS }}

  phase2_gpu:
    desc: Submit Phase 2 as a GPU job
    vars:
      input: '{{ .input | default "data/pipeline_run/metadata_phase1.jsonl" }}'
      output: '{{ .output | default "data/pipeline_run/metadata_phase2.jsonl" }}'
      rules: '{{ .rules | default "data/rules.jsonl" }}'
      model: '{{ .model | default "Qwen/Qwen2.5-7B-Instruct" }}'
      backend: '{{ .backend | default "local" }}'
      embed_model: '{{ .embed_model | default "all-MiniLM-L6-v2" }}'
      base_url: '{{ .base_url | default "" }}'
      concurrency: '{{ .concurrency | default "8" }}'
      max_retries: '{{ .max_retries | default "3" }}'
      hf_home: '{{ .hf_home | default "/lustre/users/${USER}/hf-cache" }}'
      cpu: '{{ .cpu | default "128" }}'
      p: '{{ .p | default "002-partition-default" }}'
      tag: '{{ .tag | default "latest" }}'
      log_root: '{{ .log_root | default "./logs" }}'
    cmds:
      - |
        mkdir -p {{ .log_root }}
        WORKDIR=$(pwd)
        sbatch <<EOF
        #!/bin/bash
        #SBATCH --exclude=srdgx00095,srdgx00096,srdgx00113
        #SBATCH --job-name=phase2_filter
        #SBATCH --partition={{ .p }}
        #SBATCH --ntasks=1
        #SBATCH --cpus-per-task={{ .cpu }}
        #SBATCH --gres=gpu:1
        #SBATCH --output={{ .log_root }}/%x_%j.out
        #SBATCH --error={{ .log_root }}/%x_%j.err
        #SBATCH --container-image=/lustre/users/vmduc/container_cache/image_generation_pipeline:{{ .tag }}.sqsh
        #SBATCH --container-mounts=/lustre:/lustre,/store:/store,/home:/home

        cd "$WORKDIR" || { echo "Failure: Could not cd to $WORKDIR"; exit 1; }

        source .venv/bin/activate
        mkdir -p {{ .hf_home | quote }}
        export HF_HOME={{ .hf_home | quote }}
        export TRANSFORMERS_CACHE={{ .hf_home | quote }}

        PYTHONPATH=. uv run python -m pipeline.phase2_filter --input {{ .input | quote }} --output {{ .output | quote }} --rules {{ .rules | quote }} --model {{ .model | quote }} --backend {{ .backend | quote }} --embed-model {{ .embed_model | quote }} {{ if .base_url }}--base-url {{ .base_url | quote }} {{ end }}--concurrency {{ .concurrency | quote }} --max-retries {{ .max_retries | quote }} {{ .CLI_ARGS }}
        EOF

  phase3:
    desc: Run Phase 3 locally
    vars:
      input: '{{ .input | default "data/pipeline_run/metadata_phase2.jsonl" }}'
      output: '{{ .output | default "data/pipeline_run/metadata_phase3.jsonl" }}'
      rules: '{{ .rules | default "data/rules.jsonl" }}'
      model: '{{ .model | default "Qwen/Qwen2.5-7B-Instruct" }}'
      backend: '{{ .backend | default "local" }}'
      base_url: '{{ .base_url | default "" }}'
      concurrency: '{{ .concurrency | default "8" }}'
      max_retries: '{{ .max_retries | default "3" }}'
      hf_home: '{{ .hf_home | default "/lustre/users/${USER}/hf-cache" }}'
    cmds:
      - mkdir -p {{ .hf_home | quote }} && HF_HOME={{ .hf_home | quote }} TRANSFORMERS_CACHE={{ .hf_home | quote }} uv run python -m pipeline.phase3_filter --input {{ .input | quote }} --output {{ .output | quote }} --rules {{ .rules | quote }} --model {{ .model | quote }} --backend {{ .backend | quote }} {{ if .base_url }}--base-url {{ .base_url | quote }} {{ end }}--concurrency {{ .concurrency | quote }} --max-retries {{ .max_retries | quote }} {{ .CLI_ARGS }}

  phase3_gpu:
    desc: Submit Phase 3 as a GPU job
    vars:
      input: '{{ .input | default "data/pipeline_run/metadata_phase2.jsonl" }}'
      output: '{{ .output | default "data/pipeline_run/metadata_phase3.jsonl" }}'
      rules: '{{ .rules | default "data/rules.jsonl" }}'
      model: '{{ .model | default "Qwen/Qwen2.5-7B-Instruct" }}'
      backend: '{{ .backend | default "local" }}'
      base_url: '{{ .base_url | default "" }}'
      concurrency: '{{ .concurrency | default "8" }}'
      max_retries: '{{ .max_retries | default "3" }}'
      hf_home: '{{ .hf_home | default "/lustre/users/${USER}/hf-cache" }}'
      cpu: '{{ .cpu | default "128" }}'
      p: '{{ .p | default "002-partition-default" }}'
      tag: '{{ .tag | default "latest" }}'
      log_root: '{{ .log_root | default "./logs" }}'
    cmds:
      - |
        mkdir -p {{ .log_root }}
        WORKDIR=$(pwd)
        sbatch <<EOF
        #!/bin/bash
        #SBATCH --exclude=srdgx00095,srdgx00096,srdgx00113
        #SBATCH --job-name=phase3_filter
        #SBATCH --partition={{ .p }}
        #SBATCH --ntasks=1
        #SBATCH --cpus-per-task={{ .cpu }}
        #SBATCH --gres=gpu:1
        #SBATCH --output={{ .log_root }}/%x_%j.out
        #SBATCH --error={{ .log_root }}/%x_%j.err
        #SBATCH --container-image=/lustre/users/vmduc/container_cache/image_generation_pipeline:{{ .tag }}.sqsh
        #SBATCH --container-mounts=/lustre:/lustre,/store:/store,/home:/home

        cd "$WORKDIR" || { echo "Failure: Could not cd to $WORKDIR"; exit 1; }

        source .venv/bin/activate
        mkdir -p {{ .hf_home | quote }}
        export HF_HOME={{ .hf_home | quote }}
        export TRANSFORMERS_CACHE={{ .hf_home | quote }}

        PYTHONPATH=. uv run python -m pipeline.phase3_filter --input {{ .input | quote }} --output {{ .output | quote }} --rules {{ .rules | quote }} --model {{ .model | quote }} --backend {{ .backend | quote }} {{ if .base_url }}--base-url {{ .base_url | quote }} {{ end }}--concurrency {{ .concurrency | quote }} --max-retries {{ .max_retries | quote }} {{ .CLI_ARGS }}
        EOF

  phase4:
    desc: Run Phase 4 locally
    vars:
      input: '{{ .input | default "data/pipeline_run/metadata_phase3.jsonl" }}'
      output: '{{ .output | default "data/pipeline_run/metadata_phase4.jsonl" }}'
      rules: '{{ .rules | default "data/rules.jsonl" }}'
      model: '{{ .model | default "Qwen/Qwen3-VL-8B-Thinking" }}'
      backend: '{{ .backend | default "local" }}'
      max_side: '{{ .max_side | default "512" }}'
      min_score_gap: '{{ .min_score_gap | default "0.4" }}'
      project_root: '{{ .project_root | default "." }}'
      base_url: '{{ .base_url | default "" }}'
      hf_home: '{{ .hf_home | default "/lustre/users/${USER}/hf-cache" }}'
    cmds:
      - mkdir -p {{ .hf_home | quote }} && HF_HOME={{ .hf_home | quote }} TRANSFORMERS_CACHE={{ .hf_home | quote }} uv run python -m pipeline.phase4_filter --input {{ .input | quote }} --output {{ .output | quote }} --rules {{ .rules | quote }} --model {{ .model | quote }} --backend {{ .backend | quote }} {{ if .base_url }}--base-url {{ .base_url | quote }} {{ end }}--max-side {{ .max_side | quote }} --min-score-gap {{ .min_score_gap | quote }} --project-root {{ .project_root | quote }} {{ .CLI_ARGS }}

  phase4_gpu:
    desc: Submit Phase 4 as a GPU job
    vars:
      input: '{{ .input | default "data/pipeline_run/metadata_phase3.jsonl" }}'
      output: '{{ .output | default "data/pipeline_run/metadata_phase4.jsonl" }}'
      rules: '{{ .rules | default "data/rules.jsonl" }}'
      model: '{{ .model | default "Qwen/Qwen3-VL-8B-Thinking" }}'
      backend: '{{ .backend | default "local" }}'
      max_side: '{{ .max_side | default "512" }}'
      min_score_gap: '{{ .min_score_gap | default "0.4" }}'
      project_root: '{{ .project_root | default "." }}'
      base_url: '{{ .base_url | default "" }}'
      hf_home: '{{ .hf_home | default "/lustre/users/${USER}/hf-cache" }}'
      cpu: '{{ .cpu | default "128" }}'
      p: '{{ .p | default "002-partition-default" }}'
      tag: '{{ .tag | default "latest" }}'
      log_root: '{{ .log_root | default "./logs" }}'
    cmds:
      - |
        mkdir -p {{ .log_root }}
        WORKDIR=$(pwd)
        sbatch <<EOF
        #!/bin/bash
        #SBATCH --exclude=srdgx00095,srdgx00096,srdgx00113
        #SBATCH --job-name=phase4_filter
        #SBATCH --partition={{ .p }}
        #SBATCH --ntasks=1
        #SBATCH --cpus-per-task={{ .cpu }}
        #SBATCH --gres=gpu:1
        #SBATCH --output={{ .log_root }}/%x_%j.out
        #SBATCH --error={{ .log_root }}/%x_%j.err
        #SBATCH --container-image=/lustre/users/vmduc/container_cache/image_generation_pipeline:{{ .tag }}.sqsh
        #SBATCH --container-mounts=/lustre:/lustre,/store:/store,/home:/home

        cd "$WORKDIR" || { echo "Failure: Could not cd to $WORKDIR"; exit 1; }

        source .venv/bin/activate
        mkdir -p {{ .hf_home | quote }}
        export HF_HOME={{ .hf_home | quote }}
        export TRANSFORMERS_CACHE={{ .hf_home | quote }}

        PYTHONPATH=. uv run python -m pipeline.phase4_filter --input {{ .input | quote }} --output {{ .output | quote }} --rules {{ .rules | quote }} --model {{ .model | quote }} --backend {{ .backend | quote }} {{ if .base_url }}--base-url {{ .base_url | quote }} {{ end }}--max-side {{ .max_side | quote }} --min-score-gap {{ .min_score_gap | quote }} --project-root {{ .project_root | quote }} {{ .CLI_ARGS }}
        EOF

  phase5:
    desc: Run Phase 5 locally
    vars:
      input: '{{ .input | default "data/pipeline_run/metadata_phase4.jsonl" }}'
      output: '{{ .output | default "data/pipeline_run/metadata_phase5.jsonl" }}'
      max_per_category: '{{ .max_per_category | default "0" }}'
      max_bias_ratio: '{{ .max_bias_ratio | default "0.40" }}'
      seed: '{{ .seed | default "42" }}'
    cmds:
      - uv run python -m pipeline.phase5_filter --input {{ .input | quote }} --output {{ .output | quote }} --max-per-category {{ .max_per_category | quote }} --max-bias-ratio {{ .max_bias_ratio | quote }} --seed {{ .seed | quote }} {{ .CLI_ARGS }}

  eval:
    desc: Run intrinsic dataset evaluation (no GPU required)
    vars:
      dataset: '{{ .dataset | default "data/pipeline_run/metadata_phase5.jsonl" }}'
      run_summary: '{{ .run_summary | default "data/pipeline_run/run_summary.json" }}'
      diversity_report: '{{ .diversity_report | default "data/pipeline_run/metadata_phase5_diversity_report.json" }}'
      output_dir: '{{ .output_dir | default "data/eval_results" }}'
    cmds:
      - uv run python -m eval.run_eval --dataset {{ .dataset | quote }} --run-summary {{ .run_summary | quote }} --diversity-report {{ .diversity_report | quote }} --output-dir {{ .output_dir | quote }} {{ .CLI_ARGS }}

  eval_gpu:
    desc: Run full evaluation including T2I benchmarking (requires GPU)
    vars:
      dataset: '{{ .dataset | default "release/v1.0/metadata_subset.jsonl" }}'
      run_summary: '{{ .run_summary | default "" }}'
      diversity_report: '{{ .diversity_report | default "" }}'
      output_dir: '{{ .output_dir | default "release/v1.0/eval_results/t2i_models" }}'
      t2i_models: '{{ .t2i_models | default "sd14 sd21 pixart_alpha cogview4 janus_pro hidream" }}'
      hf_home: '{{ .hf_home | default "/lustre/users/${USER}/hf-cache" }}'
      cpu: '{{ .cpu | default "128" }}'
      p: '{{ .p | default "002-partition-default" }}'
      tag: '{{ .tag | default "latest" }}'
      log_root: '{{ .log_root | default "./logs" }}'
    cmds:
      - |
        mkdir -p {{ .log_root }}
        WORKDIR=$(pwd)
        sbatch <<EOF
        #!/bin/bash
        #SBATCH --exclude=srdgx00095,srdgx00096,srdgx00113
        #SBATCH --job-name=t2i_eval
        #SBATCH --partition={{ .p }}
        #SBATCH --ntasks=1
        #SBATCH --cpus-per-task={{ .cpu }}
        #SBATCH --gres=gpu:1
        #SBATCH --output={{ .log_root }}/%x_%j.out
        #SBATCH --error={{ .log_root }}/%x_%j.err
        #SBATCH --container-image=/lustre/users/vmduc/container_cache/image_generation_pipeline:{{ .tag }}.sqsh
        #SBATCH --container-mounts=/lustre:/lustre,/store:/store,/home:/home

        cd "$WORKDIR" || { echo "Failure: Could not cd to $WORKDIR"; exit 1; }

        source .venv/bin/activate
        mkdir -p {{ .hf_home | quote }}
        export HF_HOME={{ .hf_home | quote }}
        export TRANSFORMERS_CACHE={{ .hf_home | quote }}

        PYTHONPATH=. uv run python -m eval.run_eval --dataset {{ .dataset | quote }} {{ if .run_summary }}--run-summary {{ .run_summary | quote }}{{ end }} {{ if .diversity_report }}--diversity-report {{ .diversity_report | quote }}{{ end }} --output-dir {{ .output_dir | quote }} --eval-t2i --t2i-models {{ .t2i_models }} --image-root release/v1.0/ --plots {{ .CLI_ARGS }}
        EOF

  eval_intrinsic:
    desc: Run CPU-only intrinsic eval on the release subset (no GPU needed, ~5 min)
    vars:
      dataset: '{{ .dataset | default "release/v1.0/metadata_subset.jsonl" }}'
      output_dir: '{{ .output_dir | default "release/v1.0/eval_results" }}'
    cmds:
      - uv run python -m eval.run_eval --dataset {{ .dataset | quote }} --output-dir {{ .output_dir | quote }} {{ .CLI_ARGS }}

  eval_filter_gpu:
    desc: Run safety filter evaluation on pre-generated images (requires GPU, ~4-8h)
    vars:
      dataset: '{{ .dataset | default "release/v1.0/metadata_subset.jsonl" }}'
      output_dir: '{{ .output_dir | default "release/v1.0/eval_results/filters" }}'
      image_root: '{{ .image_root | default "release/v1.0/" }}'
      filters: '{{ .filters | default "clip_nsfw q16 sd_filter llava_guard internvl" }}'
      hf_home: '{{ .hf_home | default "/lustre/users/${USER}/hf-cache" }}'
      cpu: '{{ .cpu | default "128" }}'
      p: '{{ .p | default "002-partition-default" }}'
      tag: '{{ .tag | default "latest" }}'
      log_root: '{{ .log_root | default "./logs" }}'
    cmds:
      - |
        mkdir -p {{ .log_root }}
        WORKDIR=$(pwd)
        sbatch <<EOF
        #!/bin/bash
        #SBATCH --exclude=srdgx00095,srdgx00096,srdgx00113
        #SBATCH --job-name=filter_eval
        #SBATCH --partition={{ .p }}
        #SBATCH --ntasks=1
        #SBATCH --cpus-per-task={{ .cpu }}
        #SBATCH --gres=gpu:1
        #SBATCH --output={{ .log_root }}/%x_%j.out
        #SBATCH --error={{ .log_root }}/%x_%j.err
        #SBATCH --container-image=/lustre/users/vmduc/container_cache/image_generation_pipeline:{{ .tag }}.sqsh
        #SBATCH --container-mounts=/lustre:/lustre,/store:/store,/home:/home

        cd "$WORKDIR" || { echo "Failure: Could not cd to $WORKDIR"; exit 1; }

        source .venv/bin/activate
        mkdir -p {{ .hf_home | quote }}
        export HF_HOME={{ .hf_home | quote }}
        export TRANSFORMERS_CACHE={{ .hf_home | quote }}

        PYTHONPATH=. uv run python -m eval.run_eval \
          --dataset {{ .dataset | quote }} \
          --output-dir {{ .output_dir | quote }} \
          --eval-filters \
          --safety-filters {{ .filters }} \
          --image-root {{ .image_root | quote }} \
          {{ .CLI_ARGS }}
        EOF

  eval_test:
    desc: Run the eval module automated tests
    cmds:
      - uv run python tests/eval_test.py

  generate_srun:
    vars:
      nproc: '{{ .nproc | default "1" }}'
      cpu: '{{ .cpu | default "128" }}'
      p: '{{ .p | default "002-partition-default" }}'
      tag: '{{ .tag | default "latest" }}'
      log_root: '{{ .log_root | default "./logs" }}'
    cmds:
      - |
        srun \
          --job-name=data_generate \
          --gres=gpu:1 \
          --container-mounts=/lustre:/lustre,/store:/store,/home:/home \
          --container-image=/lustre/users/vmduc/container_cache/image_generation_pipeline:{{ .tag }}.sqsh \
          --partition="002-partition-default" \
          --output={{ .log_root }}/%x_%j.out \
          --error={{ .log_root }}/%x_%j.err \
          bash -c "cd ${PWD} && source .venv/bin/activate && \
            PYTHONPATH=. uv run python generate_data.py {{.CLI_ARGS}}"

  eval_exp:
    desc: Run CPU-only NeurIPS experiments (exp1 + exp9, no GPU required)
    vars:
      dataset: '{{ .dataset | default "data/pipeline_run/metadata_phase5.jsonl" }}'
      output_dir: '{{ .output_dir | default "data/eval_results/experiments" }}'
    cmds:
      - uv run python -m eval.experiments.run_experiments --dataset {{ .dataset | quote }} --output-dir {{ .output_dir | quote }} --experiments exp1 exp9 {{ .CLI_ARGS }}

  eval_exp_gpu:
    desc: Run all NeurIPS experiments (requires GPU — submits as SLURM job)
    vars:
      dataset: '{{ .dataset | default "release/v1.0/metadata_subset.jsonl" }}'
      output_dir: '{{ .output_dir | default "release/v1.0/eval_results/experiments" }}'
      t2i_models: '{{ .t2i_models | default "sd14 sd21 pixart_alpha cogview4 janus_pro hidream" }}'
      hf_home: '{{ .hf_home | default "/lustre/users/${USER}/hf-cache" }}'
      cpu: '{{ .cpu | default "128" }}'
      p: '{{ .p | default "002-partition-default" }}'
      tag: '{{ .tag | default "latest" }}'
      log_root: '{{ .log_root | default "./logs" }}'
    cmds:
      - |
        mkdir -p {{ .log_root }}
        WORKDIR=$(pwd)
        sbatch <<EOF
        #!/bin/bash
        #SBATCH --exclude=srdgx00095,srdgx00096,srdgx00113
        #SBATCH --job-name=t2i_exp
        #SBATCH --partition={{ .p }}
        #SBATCH --ntasks=1
        #SBATCH --cpus-per-task={{ .cpu }}
        #SBATCH --gres=gpu:1
        #SBATCH --output={{ .log_root }}/%x_%j.out
        #SBATCH --error={{ .log_root }}/%x_%j.err
        #SBATCH --container-image=/lustre/users/vmduc/container_cache/image_generation_pipeline:{{ .tag }}.sqsh
        #SBATCH --container-mounts=/lustre:/lustre,/store:/store,/home:/home

        cd "$WORKDIR" || { echo "Failure: Could not cd to $WORKDIR"; exit 1; }

        source .venv/bin/activate
        mkdir -p {{ .hf_home | quote }}
