version: "3"

vars:
  workdir: '{{ .workdir | default "data/pipeline_run" }}'
  rules: '{{ .rules | default "data/rules.jsonl" }}'
  hf_home: '{{ .hf_home | default "~/.cache/huggingface" }}'

tasks:
  pipeline:
    desc: Run the full ASL pipeline end-to-end (Path B; pass input=<jsonl> for Path A)
    vars:
      input: '{{ .input | default "" }}'
    env:
      HF_HOME: '{{ .hf_home }}'
      TRANSFORMERS_CACHE: '{{ .hf_home }}'
    cmds:
      - |
        if [ -n "{{ .input }}" ]; then
          uv run python safegrad/scripts/run_pipeline.py \
            --paired-input {{ .input | quote }} \
            --workdir {{ .workdir | quote }} \
            --rules {{ .rules | quote }} {{ .CLI_ARGS }}
        else
          uv run python safegrad/scripts/run_pipeline.py \
            --workdir {{ .workdir | quote }} \
            --rules {{ .rules | quote }} {{ .CLI_ARGS }}
        fi

  test_gpu:
    desc: Submit the end-to-end smoke test (Stages 1-4 on the bundled 6-record sample) as a SLURM GPU job
    cmds:
      - mkdir -p logs && sbatch run_test.sh

  eval:
    desc: Run the evaluation suite on a dataset export (dataset=<path to metadata.jsonl>)
    vars:
      dataset: '{{ .dataset | default "release/v1/metadata.jsonl" }}'
      output: '{{ .output | default "data/eval_results" }}'
    env:
      HF_HOME: '{{ .hf_home }}'
      TRANSFORMERS_CACHE: '{{ .hf_home }}'
    cmds:
      - uv run python -m safegrad.eval.run_eval --dataset {{ .dataset | quote }} --output-dir {{ .output | quote }} {{ .CLI_ARGS }}
